[project]
name = "job-stager"
version = "0.1.0"
description = "Intelligent job application staging agent"
readme = "README.md"
authors = [
    { name = "Milen", email = "milenpopat@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "google-api-python-client>=2.200.0",
    "google-auth>=2.57.1",
    "httpx>=0.28.1",
    "playwright>=1.62.0",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.3",
    "uvicorn>=0.52.4",
]

[project.scripts]
job-stager = "cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "cli"]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]

